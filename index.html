<!DOCTYPE html>
<html lang='ar' dir='rtl'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='theme-color' content='#0E1626'>
<title>الأدعية</title>
<link rel='manifest' href='manifest.json'>
<link rel='icon' href='icons/icon-192.png'>
<link rel='apple-touch-icon' href='icons/icon-192.png'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='apple-mobile-web-app-title' content='الأدعية'>
<meta name='description' content='أدعية وأذكار منظّمة حسب الوقت والمناسبة'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap' rel='stylesheet'>
<style>
:root{--bg:#0E1626;--panel:#16223A;--panel2:#1D2C49;--line:#27385C;--text:#ECE7DC;--muted:#8B9CBA;--accent:#8E9BE0;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;line-height:1.6}
.sky{height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 64px}
header{padding:24px 0 0}
.brand{font-family:Amiri,serif;font-size:30px;font-weight:700}
.tabs{display:flex;gap:8px;margin:16px 0 20px}
.tab{flex:1;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--muted);font:inherit;font-size:15px;cursor:pointer;transition:.2s}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#0E1626;font-weight:600}
.hijri{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.hijri-date{font-family:Amiri,serif;font-size:26px;font-weight:700}
.hijri-greg{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;margin-top:10px;padding:5px 12px;background:var(--accent);color:#0E1626;border-radius:999px;font-size:13px;font-weight:600}
.adjust{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.adjust button{padding:4px 11px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.adjust button:hover{color:var(--text);border-color:var(--accent)}
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
input[type=search]{width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--text);font:inherit}
input[type=search]::placeholder{color:var(--muted)}
.chipsbar{display:flex;align-items:center;gap:6px}
.arrow{flex:none;width:30px;height:30px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:17px;line-height:1;cursor:pointer;transition:.2s}
.arrow:hover{color:var(--text);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-behavior:smooth;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#0E1626;font-weight:600}
.dua{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.dua p{font-family:Amiri,serif;font-size:23px;line-height:2.05;margin:0 0 10px}
.dua p:last-of-type{margin-bottom:16px}
.dua p+p{padding-top:10px;border-top:1px dashed var(--line)}
.note{font-size:13px;color:var(--muted);margin:0 0 14px!important;font-family:inherit!important;line-height:1.6!important;border:0!important;padding:0!important}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{padding:3px 9px;background:var(--panel2);border-radius:999px}
.acts{display:flex;gap:8px}
.ptimes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.pt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;min-width:58px}
.pt b{font-size:12px;font-weight:500;color:var(--muted)}
.pt span{font-size:14px;font-variant-numeric:tabular-nums}
.pt.now{border-color:var(--accent);background:rgba(255,255,255,.03)}
.pt.now b,.pt.now span{color:var(--accent)}
.clock{margin-top:8px;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;display:flex;gap:8px;justify-content:center;align-items:center}
.clock-sep{color:var(--muted)}
#clockLabel{color:var(--muted)}
.more{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 28px}
#moreBtn{padding:11px 26px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--text);font:inherit;font-size:15px;cursor:pointer;transition:.15s}
#moreBtn:hover{border-color:var(--accent);color:var(--accent)}
#batchInfo{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.cbtn{padding:10px 22px;background:var(--accent);border:1px solid var(--accent);border-radius:999px;color:#0E1626;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.cbtn:active{transform:scale(.96)}
.cnum{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.cnum.done{color:var(--accent);font-weight:600}
.creset{padding:6px 12px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.creset:hover{color:var(--text);border-color:var(--accent)}
.act{padding:6px 12px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.act:hover{color:var(--text);border-color:var(--accent)}
.act[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.count{margin:22px 0 0;text-align:center;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:480px){.dua p{font-size:21px}.brand{font-size:26px}.hijri-date{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class='sky'></div>
<div class='wrap'>
<header><div class='brand'>الأدعية</div></header>

<div class='tabs' role='tablist'>
  <button class='tab' id='tabToday' role='tab' aria-selected='true'>دعاء اليوم</button>
  <button class='tab' id='tabBrowse' role='tab' aria-selected='false'>تصفّح الكل</button>
</div>

<section id='viewToday'>
  <div class='hijri'>
    <div class='hijri-date' id='hDate'>…</div>
    <div class='hijri-greg' id='gDate'></div>
    <div class='clock'><span id='clock'></span><span class='clock-sep'>·</span><span id='clockLabel'></span></div>
    <div class='ptimes' id='ptimes'></div>
    <div id='badgeBox'></div>
    <div class='adjust'>
      <span>تعديل التاريخ الهجري:</span>
      <button id='minus'>− يوم</button>
      <button id='plus'>+ يوم</button>
      <span id='offText'></span>
    </div>
    <div class='adjust'>
      <span id='locName'></span>
      <button id='geoBtn'>تحديد موقعي</button>
      <button id='geoReset'>القدس</button>
      <button id='installBtn' hidden>تثبيت التطبيق</button>
    </div>
  </div>
  <div id='todayList'></div>
  <div class='more'><button id='moreBtn'>أدعية أخرى</button><span id='batchInfo'></span></div>
</section>

<section id='viewBrowse' hidden>
  <div class='tools'>
    <input type='search' id='q' placeholder='ابحث في الأدعية…' aria-label='بحث'>
    <div class='chipsbar'>
      <button class='arrow' id='chipPrev' aria-label='المجموعات السابقة' hidden>›</button>
      <div class='chips' id='chips'></div>
      <button class='arrow' id='chipNext' aria-label='المجموعات التالية' hidden>‹</button>
    </div>
  </div>
  <div id='browseList'></div>
  <p class='count' id='count'></p>
</section>
</div>

<script>
var CAT={},state={duas:[],cats:[],active:'all',q:'',favs:new Set(),off:0,counts:{}};
var CAP=7,PAGE=5,SLOT=30*60*1000;
state.bump=0;state.pool=[];
try{state.favs=new Set(JSON.parse(localStorage.getItem('adiya:favs')||'[]'))}catch(e){}
try{state.off=Number(localStorage.getItem('adiya:hijriOffset')||0)||0}catch(e){}
try{state.counts=JSON.parse(localStorage.getItem('adiya:counts')||'{}')||{}}catch(e){}

var HMONTH=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
var PBUH='\uFDFA';
var TASH=/[\u064B-\u0652\u0670\u0640]/g;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function bare(s){return String(s).replace(TASH,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}

/* ---- الصلاة على النبي ﷺ بعد كل ذكر له ---- */
var H='[\u064B-\u0652\u0670\u0640]*';
function pat(w){return w.split('').map(function(c){return c===' '?'\\s+':c}).join(H)+H}
var NAMES=['رسول الله','النبي','نبينا','نبيك','نبيه','الرسول','محمدا','محمد'];
var RE_NAME=new RegExp('('+NAMES.map(pat).join('|')+')(?![\u0621-\u064A])','g');
var SKIP=['صلي الله عليه','\uFDFA','السلام عليك ايها النبي','اللهم صل علي محمد','صل وسلم','عليه السلام','صلي الله علي'];
var RE_VERSE=/^[\u0600-\u06FF\s]+\s[\u0660-\u0669\d]+(\s*[-\u2013]\s*[\u0660-\u0669\d]+)?$/;

function isQuran(src){var b=bare(src||'').trim();return b.indexOf('القران')>=0||RE_VERSE.test(b)}

function salla(t,src){
  if(isQuran(src))return t;
  var b=bare(t);
  for(var i=0;i<SKIP.length;i++){if(b.indexOf(SKIP[i])>=0)return t}
  return t.replace(RE_NAME,function(m){return m+' '+PBUH});
}

function hijriOf(date){
  try{
    var f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}),p={};
    f.formatToParts(date).forEach(function(x){p[x.type]=x.value});
    return {d:+p.day,m:+p.month,y:+p.year};
  }catch(e){return null}
}

function shifted(){var d=new Date();d.setDate(d.getDate()+state.off);return d}

function accentFor(h,t,p){
  if(h&&h.m===9)return '#C9A227';
  if(h&&(h.m===10&&h.d<=3||h.m===12&&h.d>=10&&h.d<=13))return '#5EC2A8';
  if(t>=p.fajr&&t<p.sunrise)return '#E8A0A8';
  if(t>=p.sunrise&&t<p.dhuhr)return '#7FC7C2';
  if(t>=p.dhuhr&&t<p.asr)return '#EBC46A';
  if(t>=p.asr&&t<p.maghrib)return '#E08D5A';
  return '#8E9BE0';
}

/* ---- تصنيفات الوقت اليومي ---- */
/* ---- مواعيد الصلاة (حساب محلّي بلا إنترنت) ---- */
var DEG=Math.PI/180, AFTER=30/60;
var LOC={lat:31.7683,lng:35.2137,name:'القدس'};
try{var _l=JSON.parse(localStorage.getItem('adiya:loc')||'null');if(_l&&_l.lat)LOC=_l}catch(e){}

function jdOf(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){
  var D=jd-2451545.0,g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360,
      L=(q+1.915*Math.sin(g*DEG)+0.020*Math.sin(2*g*DEG))%360,e=23.439-0.00000036*D,
      RA=Math.atan2(Math.cos(e*DEG)*Math.sin(L*DEG),Math.cos(L*DEG))/DEG/15,
      decl=Math.asin(Math.sin(e*DEG)*Math.sin(L*DEG))/DEG;
  RA=(RA+24)%24;var EqT=q/15-RA;if(EqT>12)EqT-=24;if(EqT<-12)EqT+=24;
  return {d:decl,eq:EqT};
}
function hourAngle(lat,decl,ang){
  var c=(-Math.sin(ang*DEG)-Math.sin(lat*DEG)*Math.sin(decl*DEG))/(Math.cos(lat*DEG)*Math.cos(decl*DEG));
  return (c>1||c<-1)?null:Math.acos(c)/DEG/15;
}
function prayerTimes(date){
  var lat=LOC.lat,lng=LOC.lng,tz=-date.getTimezoneOffset()/60,
      jd=jdOf(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24),
      s=sunPos(jd),dh=12+tz-lng/15-s.eq,
      sr=hourAngle(lat,s.d,0.833),fj=hourAngle(lat,s.d,18),ish=hourAngle(lat,s.d,17),
      asrA=-Math.atan(1/(1+Math.tan(Math.abs(lat-s.d)*DEG)))/DEG,
      ar=hourAngle(lat,s.d,asrA);
  return {fajr:fj==null?4:dh-fj, sunrise:sr==null?6:dh-sr, dhuhr:dh,
          asr:ar==null?15:dh+ar, maghrib:sr==null?18:dh+sr, isha:ish==null?20:dh+ish};
}
var PNAME={fajr:'الفجر',sunrise:'الشروق',dhuhr:'الظهر',asr:'العصر',maghrib:'المغرب',isha:'العشاء'};
var PORDER=['fajr','sunrise','dhuhr','asr','maghrib','isha'];
var ADHAN=['fajr','dhuhr','asr','maghrib','isha'];

function nowHours(){var d=new Date();return d.getHours()+d.getMinutes()/60}

/* الصلاة التي مضى على أذانها أقلّ من نصف ساعة */
function recentAdhan(p,t){
  for(var i=0;i<ADHAN.length;i++){
    var k=ADHAN[i],v=p[k];
    if(t>=v&&t<v+AFTER)return k;
  }
  if(t<p.fajr&&p.isha>p.fajr){ /* بعد منتصف الليل */
    var d=t+24-p.isha; if(d>=0&&d<AFTER)return 'isha';
  }
  return null;
}

function timeCats(t,p){
  var out=[],r=recentAdhan(p,t);
  if(r)out.push('after-prayer');
  if(t>=p.fajr&&t<p.sunrise){out.push('waking');out.push('morning')}
  else if(t>=p.sunrise&&t<p.asr)out.push('morning');
  else if(t>=p.asr&&t<p.isha)out.push('evening');
  else out.push('sleep');
  return out;
}
function timeLabel(t,p){
  var r=recentAdhan(p,t);
  if(r)return 'أذكار ما بعد صلاة '+PNAME[r];
  if(t>=p.fajr&&t<p.sunrise)return 'أذكار الاستيقاظ والصباح';
  if(t>=p.sunrise&&t<p.asr)return 'أذكار الصباح';
  if(t>=p.asr&&t<p.isha)return 'أذكار المساء';
  return 'أذكار النوم';
}

function occasionOf(h,greg){
  var cats=[],label='';
  if(h){
    if(h.m===9){
      cats.push('ramadan');label='رمضان';
      if(h.d>=21){cats.push('last-ten');label='العشر الأواخر من رمضان';}
      if(h.d===27){cats.push('laylat-alqadr');label='ليلة السابع والعشرين';}
      if(h.d>=29){cats.push('khatm-quran');label='خواتيم رمضان';}
    }else if(h.m===10&&h.d<=3){cats.push('eid-fitr');label='عيد الفطر';}
    else if(h.m===12&&h.d<=9){
      cats.push('dhulhijjah');label='العشر من ذي الحجة';
      if(h.d===9){cats.push('arafah');label='يوم عرفة';}
    }
    else if(h.m===12&&h.d>=10&&h.d<=13){cats.push('eid-adha');label='عيد الأضحى';}
    else if(h.m===1&&h.d===1){cats.push('hijri-new-year');label='رأس السنة الهجرية';}
    else if(h.m===1&&h.d===10){cats.push('ashura');label='يوم عاشوراء';}
  }
  if(greg.getDay()===5){cats.push('friday');label=label?label+' · الجمعة':'يوم الجمعة';}
  return {cats:cats,label:label};
}

function card(d){
  var n=d.repeat>1?d.repeat:1,body='',t=salla(d.text,d.source);
  if(n>CAP){
    var c=state.counts[d.id]||0;
    body='<p>'+esc(t)+'</p>'+
      '<div class="counter">'+
      '<button class="cbtn" data-count="'+d.id+'">سبِّح</button>'+
      '<span class="cnum'+(c>=n?' done':'')+'" id="cnt'+d.id+'">'+c+' / '+n+'</span>'+
      '<button class="creset" data-creset="'+d.id+'">تصفير</button>'+
      '</div>';
  }else{
    for(var i=0;i<n;i++)body+='<p>'+esc(t)+'</p>';
  }
  var tags=d.categories.map(function(c){return '<span class="tag">'+esc(CAT[c]||c)+'</span>'}).join('');
  if(d.source)tags+='<span class="tag">'+esc(d.source)+'</span>';
  var on=state.favs.has(d.id);
  return '<article class="dua">'+body+
    (d.note?'<p class="note">'+esc(d.note)+'</p>':'')+
    '<div class="meta"><div class="tags">'+tags+'</div><div class="acts">'+
    '<button class="act" data-copy="'+d.id+'">نسخ</button>'+
    '<button class="act" data-fav="'+d.id+'" aria-pressed="'+on+'">'+(on?'★ مفضّل':'☆ مفضّلة')+'</button>'+
    '</div></div></article>';
}

function pad2(n){return (n<10?'0':'')+n}
function clockText(d){
  var h=d.getHours(),m=d.getMinutes(),ap=h<12?'ص':'م',hh=h%12;if(hh===0)hh=12;
  return hh+':'+pad2(m)+' '+ap;
}

function renderToday(){
  var g=shifted(),h=hijriOf(g),now=new Date(),t=nowHours(),p=prayerTimes(now);
  document.documentElement.style.setProperty('--accent',accentFor(h,t,p));
  var wd=new Intl.DateTimeFormat('ar',{weekday:'long'}).format(g);
  document.getElementById('hDate').textContent=h?(wd+' ، '+h.d+' '+HMONTH[h.m-1]+' '+h.y+' هـ'):wd;
  document.getElementById('gDate').textContent=new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',year:'numeric'}).format(g);
  document.getElementById('clock').textContent=clockText(now);
  document.getElementById('clockLabel').textContent=timeLabel(t,p);
  renderPrayers(p,t);
  document.getElementById('locName').textContent=LOC.name;
  document.getElementById('offText').textContent=state.off?'('+(state.off>0?'+':'')+state.off+')':'';

  var occ=occasionOf(h,g),tc=timeCats(t,p);
  document.getElementById('badgeBox').innerHTML=
    (occ.label?'<span class="badge">'+esc(occ.label)+'</span>':'')+
    '<span class="badge">'+esc(timeLabel(t,p))+'</span>';

  var seen={},pool=[];
  function push(list){list.forEach(function(d){if(!seen[d.id]){seen[d.id]=1;pool.push(d)}})}
  if(occ.cats.length){
    push(state.duas.filter(function(d){
      return d.categories.some(function(c){return occ.cats.indexOf(c)>=0});
    }));
  }
  push(state.duas.filter(function(d){
    return d.categories.some(function(c){return tc.indexOf(c)>=0});
  }));
  push(state.duas.filter(function(d){return d.categories.indexOf('general')>=0}));
  state.pool=pool;
  renderBatch();
}

function fmtT(v){var h=Math.floor(v),m=Math.round((v-h)*60);if(m===60){h++;m=0}h=(h+24)%24;
  var ap=h<12?'ص':'م',hh=h%12;if(hh===0)hh=12;return hh+':'+pad2(m)+' '+ap}

function renderPrayers(p,t){
  var cur=null;
  for(var i=PORDER.length-1;i>=0;i--){if(t>=p[PORDER[i]]){cur=PORDER[i];break}}
  if(cur===null)cur='isha';
  document.getElementById('ptimes').innerHTML=PORDER.map(function(k){
    return '<div class="pt'+(k===cur?' now':'')+'"><b>'+PNAME[k]+'</b><span>'+fmtT(p[k])+'</span></div>';
  }).join('');
}

function saveLoc(){try{localStorage.setItem('adiya:loc',JSON.stringify(LOC))}catch(e){}}

function renderBatch(){
  var pool=state.pool,box=document.getElementById('todayList'),
      info=document.getElementById('batchInfo'),btn=document.getElementById('moreBtn');
  if(!pool.length){
    box.innerHTML='<div class="empty">لا توجد أدعية مسجّلة لهذا الوقت بعد.</div>';
    info.textContent='';btn.hidden=true;return;
  }
  var slot=Math.floor(Date.now()/SLOT),
      pages=Math.ceil(pool.length/PAGE),
      page=((slot+state.bump)%pages+pages)%pages,
      start=page*PAGE,
      rows=pool.slice(start,start+PAGE);
  box.innerHTML=rows.map(card).join('');
  info.textContent='مجموعة '+(page+1)+' من '+pages+' · '+pool.length+' دعاء لهذا الوقت';
  btn.hidden=pages<2;
}

/* ---- شريط المجموعات ---- */
var chipsBox=document.getElementById('chips'),
    chipPrev=document.getElementById('chipPrev'),
    chipNext=document.getElementById('chipNext');

function updateArrows(){
  var over=chipsBox.scrollWidth>chipsBox.clientWidth+4;
  chipPrev.hidden=!over;chipNext.hidden=!over;
}
chipPrev.addEventListener('click',function(){chipsBox.scrollBy({left:220,behavior:'smooth'})});
chipNext.addEventListener('click',function(){chipsBox.scrollBy({left:-220,behavior:'smooth'})});
window.addEventListener('resize',updateArrows);

function buildChips(){
  var items=[{id:'all',name:'الكل'},{id:'fav',name:'المفضّلة'}].concat(state.cats);
  chipsBox.innerHTML='';
  items.forEach(function(c){
    var b=document.createElement('button');
    b.className='chip';b.textContent=c.name;b.dataset.cat=c.id;
    b.setAttribute('aria-pressed',state.active===c.id);
    b.addEventListener('click',function(){state.active=c.id;markChips();renderList()});
    chipsBox.appendChild(b);
  });
  updateArrows();
}
function markChips(){
  [].forEach.call(chipsBox.children,function(b){
    b.setAttribute('aria-pressed',b.dataset.cat===state.active);
  });
}

function renderList(){
  var q=state.q;
  var rows=state.duas.filter(function(d){
    if(q&&d._s.indexOf(q)<0)return false;
    if(state.active==='all')return true;
    if(state.active==='fav')return state.favs.has(d.id);
    return d.categories.indexOf(state.active)>=0;
  });
  document.getElementById('browseList').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">لا يوجد دعاء مطابق.</div>';
  document.getElementById('count').textContent=rows.length+' من '+state.duas.length+' دعاء';
}

function renderAll(){renderToday();markChips();renderList()}

function tab(which){
  var t=which==='today';
  document.getElementById('tabToday').setAttribute('aria-selected',t);
  document.getElementById('tabBrowse').setAttribute('aria-selected',!t);
  document.getElementById('viewToday').hidden=!t;
  document.getElementById('viewBrowse').hidden=t;
  if(!t)updateArrows();
}
document.getElementById('geoBtn').addEventListener('click',function(){
  var b=this;
  if(!navigator.geolocation){b.textContent='غير مدعوم';return}
  b.textContent='جارٍ التحديد…';
  navigator.geolocation.getCurrentPosition(function(pos){
    LOC={lat:pos.coords.latitude,lng:pos.coords.longitude,name:'موقعي'};
    saveLoc();b.textContent='تحديد موقعي';renderToday();
  },function(){b.textContent='تعذّر التحديد';setTimeout(function(){b.textContent='تحديد موقعي'},2000)},
  {timeout:8000,maximumAge:864e5});
});
document.getElementById('geoReset').addEventListener('click',function(){
  LOC={lat:31.7683,lng:35.2137,name:'القدس'};saveLoc();renderToday();
});
document.getElementById('moreBtn').addEventListener('click',function(){state.bump++;renderBatch();window.scrollTo({top:0,behavior:'smooth'})});
setInterval(function(){if(!document.getElementById('viewToday').hidden)renderToday()},60000);
document.getElementById('tabToday').addEventListener('click',function(){tab('today')});
document.getElementById('tabBrowse').addEventListener('click',function(){tab('browse')});

function setOff(v){
  state.off=Math.max(-2,Math.min(2,v));
  try{localStorage.setItem('adiya:hijriOffset',state.off)}catch(e){}
  renderToday();
}
document.getElementById('minus').addEventListener('click',function(){setOff(state.off-1)});
document.getElementById('plus').addEventListener('click',function(){setOff(state.off+1)});

document.body.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var fid=b.getAttribute('data-fav'),cid=b.getAttribute('data-copy'),
      nid=b.getAttribute('data-count'),rid=b.getAttribute('data-creset');
  if(nid||rid){
    var id=Number(nid||rid),dd=state.duas.filter(function(x){return x.id===id})[0],max=dd.repeat;
    state.counts[id]=rid?0:Math.min(max,(state.counts[id]||0)+1);
    var el=document.getElementById('cnt'+id);
    if(el){el.textContent=state.counts[id]+' / '+max;el.className='cnum'+(state.counts[id]>=max?' done':'')}
    try{localStorage.setItem('adiya:counts',JSON.stringify(state.counts))}catch(e){}
    return;
  }
  if(fid){
    var id=Number(fid);
    state.favs.has(id)?state.favs.delete(id):state.favs.add(id);
    try{localStorage.setItem('adiya:favs',JSON.stringify([].slice.call(state.favs)))}catch(e){}
    renderAll();
  }else if(cid){
    var d=state.duas.filter(function(x){return x.id===Number(cid)})[0];
    var n=d.repeat>1?d.repeat:1,out=[],t=salla(d.text,d.source);
    if(n>CAP){out.push(t+'  ('+n+' مرّة)')}
    else{for(var i=0;i<n;i++)out.push(t)}
    navigator.clipboard.writeText(out.join('\n')).then(function(){
      b.textContent='نُسخ';setTimeout(function(){b.textContent='نسخ'},1400);
    });
  }
});

document.getElementById('q').addEventListener('input',function(e){
  state.q=bare(e.target.value.trim());renderList();
});

Promise.all([
  fetch('data/categories.json').then(function(r){return r.json()}),
  fetch('data/duas.json').then(function(r){return r.json()})
]).then(function(res){
  state.cats=res[0];state.duas=res[1];
  state.cats.forEach(function(c){CAT[c.id]=c.name});
  state.duas.forEach(function(d){
    d._s=bare([d.text,d.note||'',d.source||'',
      d.categories.map(function(c){return CAT[c]||c}).join(' ')].join(' '));
  });
  buildChips();
  renderAll();
}).catch(function(){
  document.getElementById('todayList').innerHTML='<div class="empty">تعذّر تحميل الأدعية.</div>';
});
/* ---- PWA ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
var deferredPrompt=null,installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;installBtn.hidden=false;
});
installBtn.addEventListener('click',function(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){deferredPrompt=null;installBtn.hidden=true});
});
window.addEventListener('appinstalled',function(){installBtn.hidden=true});
</script>
</body>
</html>
